# Configuration Sveltia CMS — voir README.md § Administration pour la mise en service.
backend:
  name: github
  repo: germain487/portfolio
  branch: main
  # Pas de base_url/auth_endpoint : le site est hébergé sur Netlify et son
  # fournisseur OAuth GitHub intégré (Project configuration → Access &
  # security → OAuth) gère l'authentification automatiquement, sans worker
  # externe (README § Administration).

# Pas d'option "local_backend" à activer : Sveltia CMS propose nativement un
# bouton « Work with Local Repository » sur son écran de connexion (via la
# File System Access API du navigateur, Chrome/Edge). En cliquant dessus et
# en sélectionnant le dossier racine du projet, les sauvegardes s'écrivent
# directement sur le disque local, sans authentification GitHub — pratique
# pour tester l'admin pendant le développement (README § Administration).

# Habillage de l'interface d'administration (voir aussi src/pages/admin.astro
# pour le thème : barre latérale colorée, contenu clair).
app_title: "Portfolio · Administration"
logo:
  src: /admin/logo.svg
site_url: https://germain-portfolio.netlify.app
display_url: https://germain-portfolio.netlify.app

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: settings
    label: "Réglages généraux"
    icon: settings
    files:
      - name: settings
        label: "Réglages généraux"
        file: src/content/settings.json
        fields:
          - { label: "Nom complet", name: nomComplet, widget: string, hint: "Affiché dans le H1 du hero et les métadonnées SEO." }
          - { label: "Wordmark (logo navbar)", name: wordmark, widget: string, hint: "Texte à côté du monogramme hexagonal dans la navbar." }
          - { label: "Titre SEO", name: titreSEO, widget: string, hint: "Titre de l'onglet du navigateur, des résultats de recherche et du partage (Open Graph)." }
          - { label: "Meta description", name: metaDescription, widget: text, hint: "180 caractères maximum, pour les moteurs de recherche." }
          - { label: "Image Open Graph", name: imageOG, widget: image, required: false, hint: "1200×630px recommandé, utilisée lors du partage du lien." }
          - { label: "Couleur d'accent", name: couleurAccent, widget: color, default: "#00E5FF", hint: "Injectée dans tout le site (boutons, liens actifs, halos lumineux)." }
          - { label: "Email de contact", name: email, widget: string }
          - { label: "Numéro WhatsApp", name: whatsapp, widget: string, hint: "Format international sans + ni espaces, ex : 224600000000" }
          - { label: "Localisation", name: localisation, widget: string }
          - { label: "Disponible pour de nouveaux projets ?", name: disponible, widget: boolean, default: true }
          - { label: "Texte du badge de disponibilité", name: badgeTexte, widget: string, hint: "Affiché dans le hero si « Disponible » est activé." }
          - { label: "CV (PDF)", name: cv, widget: file, required: false, hint: "Téléchargé via le bouton « Télécharger mon CV » du hero." }
          - label: "Réseaux sociaux"
            name: reseaux
            widget: list
            hint: "Réordonnables par glisser-déposer."
            fields:
              - { label: "Plateforme", name: plateforme, widget: select, options: ["LinkedIn", "GitHub", "X", "Facebook"] }
              - { label: "URL", name: url, widget: string }

  - name: hero
    label: Hero
    icon: home
    files:
      - name: hero
        label: Hero
        file: src/content/hero.json
        fields:
          - label: Eyebrow
            name: eyebrow
            widget: object
            hint: "Petite ligne au-dessus du nom, ex : « // salut, moi c'est »."
            fields: &texteMiseEnForme
              - { label: Texte, name: texte, widget: string }
              - label: Alignement
                name: alignement
                widget: select
                default: gauche
                options:
                  - { label: Gauche, value: gauche }
                  - { label: Centré, value: centre }
                  - { label: Droite, value: droite }
              - label: Police
                name: police
                widget: select
                default: sans
                hint: "Les 3 familles chargées sur le site — pas d'autre police pour garder l'identité visuelle cohérente."
                options:
                  - { label: "Titres (Space Grotesk)", value: display }
                  - { label: "Texte courant (Inter)", value: sans }
                  - { label: "Mono (JetBrains Mono)", value: mono }
              - label: Taille
                name: taille
                widget: select
                default: base
                hint: "Échelle du plus petit au plus grand — les tailles 3xl à 5xl s'adaptent automatiquement à l'écran (mobile/desktop)."
                options:
                  - { label: "Très petit (xs)", value: xs }
                  - { label: "Petit (sm)", value: sm }
                  - { label: "Normal (base)", value: base }
                  - { label: "Grand (lg)", value: lg }
                  - { label: "Très grand (xl)", value: xl }
                  - { label: "2× grand (2xl)", value: 2xl }
                  - { label: "Titre discret (3xl)", value: 3xl }
                  - { label: "Titre standard (4xl)", value: 4xl }
                  - { label: "Titre imposant (5xl)", value: 5xl }
          - label: Accroche
            name: accroche
            widget: object
            hint: "2 lignes maximum recommandées."
            fields: *texteMiseEnForme
          - label: "Rôles (machine à écrire)"
            name: roles
            widget: list
            hint: "Ajout, suppression et réorganisation des intitulés qui défilent en boucle."
            field: { label: Rôle, name: role, widget: string }
          - { label: "Libellé du CTA principal", name: ctaPrimaireLabel, widget: string }
          - { label: "Libellé du CTA secondaire", name: ctaSecondaireLabel, widget: string }
          - { label: "Libellé du bouton contact", name: ctaContactLabel, widget: string, default: "Me contacter", hint: "Bouton affiché sous le portrait, il renvoie vers la page Contact." }
          - { label: Portrait, name: portrait, widget: image, required: false, hint: "Tant qu'aucune photo n'est envoyée, une silhouette hexagonale s'affiche automatiquement." }

  - name: about
    label: "À propos"
    icon: person
    files:
      - name: about
        label: "À propos"
        file: src/content/about.json
        fields:
          - { label: Titre, name: titre, widget: object, fields: *texteMiseEnForme }
          - label: "Paragraphes de bio"
            name: paragraphes
            widget: list
            hint: "Le format **gras** est pris en charge. Réordonnables par glisser-déposer."
            fields:
              - { label: Texte, name: texte, widget: text }
              - label: Alignement
                name: alignement
                widget: select
                default: gauche
                options:
                  - { label: Gauche, value: gauche }
                  - { label: Centré, value: centre }
                  - { label: Droite, value: droite }
              - label: Police
                name: police
                widget: select
                default: sans
                options:
                  - { label: "Titres (Space Grotesk)", value: display }
                  - { label: "Texte courant (Inter)", value: sans }
                  - { label: "Mono (JetBrains Mono)", value: mono }
              - label: Taille
                name: taille
                widget: select
                default: base
                options:
                  - { label: "Très petit (xs)", value: xs }
                  - { label: "Petit (sm)", value: sm }
                  - { label: "Normal (base)", value: base }
                  - { label: "Grand (lg)", value: lg }
                  - { label: "Très grand (xl)", value: xl }
                  - { label: "2× grand (2xl)", value: 2xl }
                  - { label: "Titre discret (3xl)", value: 3xl }
                  - { label: "Titre standard (4xl)", value: 4xl }
                  - { label: "Titre imposant (5xl)", value: 5xl }
          - label: "Statistiques (compteurs animés)"
            name: stats
            widget: list
            hint: "Réordonnables par glisser-déposer."
            fields:
              - { label: Valeur, name: valeur, widget: number, value_type: int }
              - { label: Suffixe, name: suffixe, widget: string, required: false, hint: "Ex : « + »" }
              - { label: Libellé, name: label, widget: string }

  - name: skills
    label: "Compétences"
    icon: build
    files:
      - name: skills
        label: "Compétences"
        file: src/content/skills.json
        fields:
          - label: "Domaines de compétence"
            name: domaines
            widget: list
            fields:
              - { label: "Icône (nom Lucide)", name: icone, widget: string, hint: "Ex : server, layout-panel-left, database, cloud — voir lucide.dev/icons." }
              - { label: Titre, name: titre, widget: object, fields: *texteMiseEnForme }
              - label: Éléments
                name: items
                widget: list
                field: { label: Élément, name: item, widget: string }

  - name: projets
    label: Projets
    icon: work
    folder: src/content/projets
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{titre}} — {{annee}} ({{statut}})"
    fields:
      - { label: Titre, name: titre, widget: string, hint: "Texte simple : réutilisé comme texte alternatif, initiale de la couverture générée et titre de page — pas de mise en forme indépendante." }
      - { label: "Image de couverture (aperçu)", name: couverture, widget: image, required: false, hint: "Cliquez pour importer une photo ou une capture d'écran du projet — un aperçu s'affiche ici juste après l'envoi. Sans image, une couverture générée automatiquement (motif hexagonal) s'affiche à sa place sur le site, jamais d'image cassée." }
      - { label: Description, name: description, widget: text }
      - label: "Stack technique"
        name: stack
        widget: list
        field: { label: Technologie, name: techno, widget: string }
      - label: Tags
        name: tags
        widget: select
        multiple: true
        options: ["SaaS", "Civic Tech", "Data", "Web Design"]
        hint: "Utilisés par les filtres de la section Projets."
      - { label: Année, name: annee, widget: number, value_type: int }
      - { label: Statut, name: statut, widget: select, options: ["En ligne", "En cours", "Archivé"] }
      - { label: "Lien externe", name: lien, widget: string, required: false }
      - { label: "Ordre d'affichage", name: ordre, widget: number, value_type: int, default: 0, hint: "Les projets s'affichent du plus petit au plus grand." }
      - { label: "Brouillon", name: brouillon, widget: boolean, default: false, hint: "Masque le projet du site public sans le supprimer." }
      - { label: "Description longue", name: body, widget: markdown, required: false, hint: "Affichée sur la page de détail du projet (/projets/…). Titres, listes et gras pris en charge." }

  - name: services
    label: Services
    icon: handyman
    files:
      - name: services
        label: Services
        file: src/content/services.json
        fields:
          - label: Cartes
            name: cartes
            widget: list
            fields:
              - { label: "Icône (nom Lucide)", name: icone, widget: string }
              - { label: Titre, name: titre, widget: object, fields: *texteMiseEnForme }
              - { label: Phrase, name: phrase, widget: object, fields: *texteMiseEnForme }
          - { label: "Libellé du CTA final", name: ctaFinalLabel, widget: string }

  - name: contact
    label: Contact
    icon: mail
    files:
      - name: contact
        label: Contact
        file: src/content/contact.json
        fields:
          - { label: "Texte d'intro", name: intro, widget: object, fields: *texteMiseEnForme }
          - label: "Sujets du formulaire"
            name: sujets
            widget: list
            field: { label: Sujet, name: sujet, widget: string }
          - { label: "Message de succès", name: messageSucces, widget: string }
          - { label: "Message d'erreur", name: messageErreur, widget: string }
          - { label: "Champ — Nom", name: champNom, widget: string, default: "Nom" }
          - { label: "Champ — Email", name: champEmail, widget: string, default: "Email" }
          - { label: "Champ — Sujet", name: champSujet, widget: string, default: "Sujet" }
          - { label: "Champ — Message", name: champMessage, widget: string, default: "Message" }
          - { label: "Bouton d'envoi", name: boutonEnvoyer, widget: string, default: "Envoyer le message" }
          - { label: "Carte — Email (libellé)", name: carteEmailLabel, widget: string, default: "Email", hint: "Petit libellé mono au-dessus de l'adresse, colonne de gauche." }
          - { label: "Carte — WhatsApp (libellé)", name: carteWhatsappLabel, widget: string, default: "WhatsApp", hint: "Repris aussi comme texte du lien WhatsApp du pied de page." }
          - { label: "Carte — WhatsApp (texte)", name: carteWhatsappTexte, widget: string, default: "Discuter directement" }
          - { label: "Carte — Localisation (libellé)", name: carteLocalisationLabel, widget: string, default: "Localisation" }

  - name: footer
    label: Footer
    icon: dock_to_bottom
    files:
      - name: footer
        label: Footer
        file: src/content/footer.json
        fields:
          - { label: "Mention de signature", name: mention, widget: string, hint: "Seul texte du pied de page, centré, précédé automatiquement de « © année · »." }

  - name: chatbot
    label: "Louise (chatbot IA)"
    icon: chat
    description: "Base de connaissances synchronisée automatiquement avec les autres collections (à-propos, projets, services, contact) — rien à dupliquer ici."
    files:
      - name: chatbot
        label: "Louise (chatbot IA)"
        file: src/content/chatbot.json
        fields:
          - { label: "Activer Louise", name: actif, widget: boolean, default: true, hint: "Désactive la bulle de chat sur tout le site sans supprimer sa configuration." }
          - { label: "Message d'accueil", name: messageAccueil, widget: text, hint: "Premier message affiché à l'ouverture du panneau de discussion." }
          - label: "Questions suggérées"
            name: questionsSuggerees
            widget: list
            max: 3
            hint: "3 questions cliquables maximum, affichées à l'ouverture."
            field: { label: Question, name: question, widget: string }
          - { label: "Mention IA", name: mentionIA, widget: string, hint: "Affichée dans l'en-tête du panneau, ex : « IA — réponses indicatives »." }
          - { label: "Titre du panneau", name: titrePanneau, widget: string, default: "Louise · Guide du site" }
          - { label: "Texte d'invite du champ de saisie", name: placeholderSaisie, widget: string, default: "Posez votre question…" }
          - { label: "Message d'indisponibilité", name: messageIndisponible, widget: text, default: "Louise est indisponible pour le moment. Écrivez directement à Germain sur WhatsApp ou via la page Contact.", hint: "Affiché quand l'IA ne répond pas (clé API absente, quota dépassé, panne). Orientez vers un autre canal de contact." }
          - { label: "Libellé du bouton d'ouverture", name: libelleBouton, widget: string, default: "Ouvrir le chat avec Louise, assistante du site", hint: "Annoncé par les lecteurs d'écran et affiché en infobulle native au survol de la bulle." }
          - label: "Animation d'attention sur la bulle"
            name: animationAttention
            widget: select
            default: heartbeat_radar
            hint: "Attire l'œil du visiteur à l'arrivée sur le site avec un battement de cœur discret sur la bulle. Se coupe automatiquement, pour la session, dès que le chat est ouvert une première fois — jamais affichée si le visiteur préfère limiter les animations (prefers-reduced-motion)."
            options:
              - { label: "Battement de cœur seul", value: heartbeat }
              - { label: "Battement de cœur + onde radar (recommandé)", value: heartbeat_radar }
              - { label: "Aucune", value: aucune }
          - { label: "Couleur de la bulle", name: couleurBulle, widget: color, default: "#FF3B3B", hint: "Fond de la bulle, son halo lumineux, l'onde radar et le monogramme « L » du panneau. Indépendante de la couleur d'accent du site." }
          - { label: "Icône de la bulle", name: iconeBulle, widget: string, default: "👩", hint: "Un emoji (ex. 👩, 👩🏾, 🙋🏾‍♀️) ou une simple lettre — affiché dans la bulle et dans l'en-tête du panneau." }
          - { label: "Activer l'infobulle d'invitation", name: badgeInvitationActif, widget: boolean, default: true, hint: "Une infobulle apparaît au-dessus de la bulle après 6 secondes si le chat n'a pas encore été ouvert. Elle reste affichée (et ouvre le chat au clic) jusqu'à ce que le visiteur ouvre Louise ou la ferme — puis plus jamais pour la session." }
          - { label: "Texte de l'infobulle d'invitation", name: badgeInvitationTexte, widget: string, default: "Une question ? Je suis Louise, discutons 👋", hint: "Court — deux lignes maximum, c'est une infobulle, pas un paragraphe." }

  - name: navigation
    label: Navigation
    icon: menu
    description: "Liens du menu principal (navbar et menu mobile) et de la colonne Navigation du pied de page. Réordonnables par glisser-déposer."
    files:
      - name: navigation
        label: Navigation
        file: src/content/navigation.json
        fields:
          - label: Liens
            name: liens
            widget: list
            min: 1
            fields:
              - { label: Libellé, name: label, widget: string }
              - label: Page cible
                name: href
                widget: select
                options:
                  - { label: "Accueil (/)", value: "/" }
                  - { label: "À propos (/a-propos)", value: "/a-propos" }
                  - { label: "Projets (/projets)", value: "/projets" }
                  - { label: "Services (/services)", value: "/services" }
                  - { label: "Contact (/contact)", value: "/contact" }

  - name: seo
    label: "SEO des pages"
    icon: travel_explore
    description: "Titre d'onglet du navigateur et description pour les moteurs de recherche, page par page. L'accueil utilise le titre SEO et la meta description des Réglages généraux."
    files:
      - name: seo
        label: "SEO des pages"
        file: src/content/seo.json
        fields:
          - { label: "À propos", name: aPropos, widget: object, fields: &seoPage [ { label: "Titre", name: titre, widget: string }, { label: "Description", name: description, widget: text, hint: "180 caractères maximum." } ] }
          - { label: "Projets", name: projets, widget: object, fields: *seoPage }
          - { label: "Services", name: services, widget: object, fields: *seoPage }
          - { label: "Contact", name: contact, widget: object, fields: *seoPage }
          - { label: "Fiche projet — suffixe du titre", name: projetDetailSuffixe, widget: string, hint: "Le titre d'une fiche projet est « Titre du projet — {ce suffixe} ». Sa description reprend la description courte du projet." }

  - name: interface
    label: "Libellés d'interface"
    icon: label
    description: "Petits textes de liens et de boutons de la rubrique projets : filtre, survol des cartes et fiche projet."
    files:
      - name: interface
        label: "Libellés d'interface"
        file: src/content/interface.json
        fields:
          - label: Projets
            name: projets
            widget: object
            fields:
              - { label: "Survol d'une carte", name: decouvrir, widget: string, default: "Découvrir" }
              - { label: "Filtre « tous »", name: filtreTous, widget: string, default: "Tous", hint: "Les autres filtres reprennent les tags des projets (SaaS, Civic Tech, Data, Web Design)." }
              - { label: "Fiche — retour à la liste", name: retourListe, widget: string, default: "Tous les projets" }
              - { label: "Fiche — bouton vers le site du projet", name: voirEnLigne, widget: string, default: "Voir le projet en ligne" }
              - { label: "Fiche — projet précédent", name: precedent, widget: string, default: "Projet précédent" }
              - { label: "Fiche — projet suivant", name: suivant, widget: string, default: "Projet suivant" }

  - name: sections
    label: "Titres de section"
    icon: title
    description: "Titres et eyebrows affichés en tête des sections Compétences, Projets et Services."
    files:
      - name: sections
        label: "Titres de section"
        file: src/content/sections.json
        fields:
          - { label: "Titre — Compétences", name: skillsTitre, widget: object, fields: *texteMiseEnForme }
          - { label: "Titre — Projets", name: projetsTitre, widget: object, fields: *texteMiseEnForme }
          - { label: "Titre — Services", name: servicesTitre, widget: object, fields: *texteMiseEnForme }
          - { label: "Eyebrow — À propos", name: aProposEyebrow, widget: string, default: "// à-propos", hint: "Petite ligne mono en cyan au-dessus du titre de section (le « // » fait partie du style, à conserver ou non)." }
          - { label: "Eyebrow — Compétences", name: skillsEyebrow, widget: string, default: "// compétences" }
          - { label: "Eyebrow — Projets", name: projetsEyebrow, widget: string, default: "// projets", hint: "Affiché sur la page /projets." }
          - { label: "Eyebrow — Services", name: servicesEyebrow, widget: string, default: "// services", hint: "Affiché sur la page /services." }
          - { label: "Eyebrow — Contact", name: contactEyebrow, widget: string, default: "// contact", hint: "Affiché sur la page /contact." }
